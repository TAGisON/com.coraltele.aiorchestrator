<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supervisor — AiOrchestrator</title>
  <link rel="stylesheet" href="/shared/styles.css" />
</head>
<body>
  <div class="shell">
    <nav class="shell-nav">
      <a class="brand" href="/">AiOrchestrator</a>
      <span class="role">Supervisor</span>
      <a href="/admin/">Admin</a>
      <a href="/chat/">Chat</a>
    </nav>
    <h1>Supervisor</h1>
    <p class="lede">Read-only sessions, transcript, audit, disposition, and light analytics. Shell only (U.2) — browsers land in S.* phases.</p>

    <div class="card">
      <h2>API token (lab)</h2>
      <div class="token-row">
        <input id="token" type="password" autocomplete="off" placeholder="Bearer token" />
        <button type="button" class="btn secondary" id="save-token">Save</button>
      </div>
    </div>

    <div class="card">
      <h2>Platform probe</h2>
      <button type="button" class="btn" id="probe">Load platform status</button>
      <div class="probe" id="out"></div>
    </div>
  </div>
  <script src="/shared/api.js"></script>
  <script>
    const out = document.getElementById("out");
    const tokenInput = document.getElementById("token");
    tokenInput.value = OrchAPI.token();
    document.getElementById("save-token").onclick = () => {
      OrchAPI.setToken(tokenInput.value);
      out.textContent = "Token saved.";
      out.className = "probe ok";
    };
    document.getElementById("probe").onclick = async () => {
      out.className = "probe";
      out.textContent = "Loading…";
      try {
        const s = await OrchAPI.platformStatus();
        out.className = "probe ok";
        out.textContent =
          "status=" + s.status +
          "\nready_for_sessions=" + s.ready_for_sessions +
          "\nstore=" + s.store_backend;
      } catch (e) {
        out.className = "probe err";
        out.textContent = (e.status || "") + " " + (e.message || String(e));
      }
    };
  </script>
</body>
</html>
