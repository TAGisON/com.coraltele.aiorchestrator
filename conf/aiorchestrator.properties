# aiorchestrator production / server properties (committed — non-secrets only)
# Runtime secrets (vendor API keys) and tenant engines live in Postgres + Control API.
# Env vars override matching keys for lab emergency only.

# HTTP listen (server)
http.addr=:8011

# PostgreSQL (boot — required in production)
database.url=postgres://postgres@127.0.0.1:5432/aiorchestrator?sslmode=disable
database.require=true

# Logging
log.level=info
log.format=json
log.config=conf/logging.xml
log.base=logs/aiorchestrator
log.app_name=aiorchestrator
log.max_size_mb=10
log.max_backups=5

# Process identity
owner.instance=local

# Edge bootstrap (rotate via ops; not vendor keys)
edge.base_url=wss://localhost/edge/fs
edge.token_secret=lab-edge-hmac-change-me

# Optional seed when tenant_engines row missing (written to DB on first resolve if database.require)
engines.listen=sarvam-stt
engines.think=sarvam-llm
engines.speak=sarvam-tts
