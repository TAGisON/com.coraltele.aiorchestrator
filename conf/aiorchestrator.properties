# aiorchestrator production / server properties (committed — non-secrets only)
# Runtime config (vendor API keys, tenant engines, coral URLs) lives in Postgres + Control API.
# Env vars override matching keys for lab emergency only.
# Migrations create/alter schema only — they never insert tenant or vendor rows.

# HTTP listen (server)
http.addr=:8011

# PostgreSQL (boot — required in production)
database.url=postgres://postgres@127.0.0.1:5432/aiorchestrator?sslmode=disable
database.require=true

# Logging
log.level=info
log.format=json
log.config=conf/logging.xml
log.base=logs/aiorchestrator
log.app_name=aiorchestrator
log.max_size_mb=10
log.max_backups=5

# Process identity
owner.instance=local

# Edge bootstrap (rotate via ops; not vendor keys)
# FS at 192.168.80.145 dials this host IP (not localhost).
# Updated 2026-09-01 — was 192.168.100.150; confirm FS can reach this address.
edge.base_url=ws://192.168.25.130:8011/edge/fs
edge.token_secret=lab-edge-hmac-change-me
