# aiorchestrator production / server properties (committed — non-secrets only)
# Runtime config (vendor API keys, tenant engines, coral URLs) lives in Postgres + Control API.
# Env vars override matching keys for lab emergency only.
# Migrations create/alter schema only — they never insert tenant or vendor rows.

# HTTP listen (server)
http.addr=:8011

# PostgreSQL (boot — required in production)
database.url=postgres://postgres@127.0.0.1:5432/aiorchestrator?sslmode=disable
database.require=true

# Logging
log.level=info
log.format=json
log.config=conf/logging.xml
log.base=logs/aiorchestrator
log.app_name=aiorchestrator
log.max_size_mb=10
log.max_backups=5

# Process identity
owner.instance=local

# Edge bootstrap (rotate via ops; not vendor keys)
# FS at 192.168.80.145 dials this host IP (not localhost).
# Updated 2026-09-01 — was 192.168.100.150; confirm FS can reach this address.
edge.base_url=ws://192.168.25.130:8011/edge/fs
edge.token_secret=lab-edge-hmac-change-me

# Call recording — one stereo WAV per session (left=caller, right=agent) plus
# meta.json, under <root>/<YYYY-MM-DD>/<session-id>[-<call-id>]/.
# A leading "/" resolves against the current drive on Windows, so this same
# value is valid on every OS the orchestrator runs on.
recording.enabled=true
recording.root=/usr/local/recordings/ai-orchestrator
recording.retention_days=30

# Operator fallback prompts played when the AI pipeline cannot serve a call
# (engine down, credits exhausted, timeout, unhandled error). Upload with
#   PUT /v1/tenant/fallback/{scenario}   (audio/wav body)
# Scenarios: ai_unavailable, credits_exhausted, timeout, system_busy,
#            internal_error, generic
fallback.root=/usr/local/share/ai-orchestrator/fallback

# Blind transfer defaults — uuid_transfer <call-uuid> <dest> <dialplan> <context>
transfer.dialplan=XML
transfer.context=calltransfer
