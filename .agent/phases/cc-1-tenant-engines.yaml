id: cc-1-tenant-engines
name: Tenant system engines + docs lock (CC Phase 1)
pipeline: contact-agent-cc
exit_criteria:
  - docs/product/CONTACT_AGENT.md exists — Contact-agent vertical lock (ladder, language, voice, system engines, multi-profile, transcript/disposition)
  - docs/product/SYSTEM_ENGINES.md exists — tenant-level STT/LLM/TTS binding; session pin; no mid-session vendor hop (V1)
  - PROFILE_SCHEMA.md updated — profiles = behaviour only V1; engines inherit system; voice required for Talk/Speak
  - CONTROL_API.md documents GET/PUT /v1/tenant/engines and session.gateway_binding on GET session
  - Durable tenant engine config (store table or tenant_extension) with listen.active / think.active / speak.active
  - GET + PUT /v1/tenant/engines implemented; env fallback for single-tenant lab
  - Session create resolves system engines → capability check → persists session.gateway_binding
  - Runtime Talk path uses bound gateway ids only (no per-turn provider walk for CC)
  - go test ./internal/control/ ./internal/store/ ./internal/router/ pass
out_of_scope:
  - coral-file / home-page UI
  - Profile-level vendor override (document as later only)
  - Language lock / voice wiring / response ladder (cc-2+)
  - Mid-session vendor failover (degrade via clips/escalate only — later phases)
  - Committing secrets / .env / secrets.local.json
docs:
  - docs/product/PRODUCT_DECISIONS.md
  - docs/architecture/PROFILE_SCHEMA.md
  - docs/architecture/CONTROL_API.md
  - docs/architecture/PORTS.md
  - docs/SOLUTION.md
packages:
  - ./internal/store
  - ./internal/control
  - ./internal/router
  - ./internal/runtime
