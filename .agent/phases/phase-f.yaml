id: phase-f
name: External vendors — Sarvam lab trio
platform_first: Phase F
exit_criteria:
  - sarvam-stt Listen gateway passes same contract tests as fake-listen (CI fakes; Sarvam env-gated or lab)
  - sarvam-llm Think gateway passes same contract tests as fake-think (CI fakes; Sarvam env-gated or lab)
  - sarvam-tts Speak gateway passes same contract tests as fake-speak (CI fakes; Sarvam env-gated or lab)
  - Profile can select Sarvam ids with failover to fakes (e.g. listen [sarvam-stt, fake-listen])
  - No composer or thinkpath changes for the vendor
  - Lab realtime path documented: secrets from env / .agent/secrets.local.json only
out_of_scope:
  - Bundled duplex Talk as default
  - Rewriting ports for vendor quirks
  - Next AI gateways in this phase (deferred follow-up)
  - Committing API keys or secrets
defaults:
  vendor: sarvam
  gateways: [sarvam-stt, sarvam-llm, sarvam-tts]
  stt_model: saaras:v3
  stt_language: en-IN
  llm: sarvam default chat model from current docs
  tts: bulbul default voice from current docs
  secrets: SARVAM_API_KEY or .agent/secrets.local.json sarvam.api_key
docs:
  - docs/architecture/PLATFORM_FIRST.md
  - docs/architecture/PORTS.md
  - docs/architecture/PROFILE_SCHEMA.md
depends_on: phases a-e coral-side complete
