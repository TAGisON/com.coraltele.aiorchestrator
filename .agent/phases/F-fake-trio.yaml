id: F-fake-trio
name: Validate feature — Fake Listen Think Speak usable together
pipeline: product-validation
feature_id: F-fake-trio
status: must_test
exit_criteria:
  - Scenario for F-fake-trio reviewed and approved in scenarios.md
  - Fixtures for F-fake-trio ready (or N/A documented)
  - go_test / checks for F-fake-trio pass; run-log records result
  - audit-report covers evidence expectations for this feature (or N/A)
  - test-reviewer pass; summarizer closes round with trail in .agent/work/F-fake-trio/
out_of_scope:
  - Other features (test only F-fake-trio this round)
  - Live FreeSWITCH unless this feature is F-edge-fs-live and human unlocked
  - Committing secrets
  - Product feature coding (use coral-phase)
packages:
  - ./internal/gateway/fake
  - ./internal/runtime/composer
docs:
  - tests/agent/FEATURES.md
  - tests/agent/features/catalog.yaml
  - tests/agent/scenarios/F-fake-trio.yaml
  - tests/agent/MANIFEST.yaml
  - docs/VALIDATION_PIPELINE.md
