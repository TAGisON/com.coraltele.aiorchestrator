id: F-job-copilot
name: Validate feature — Grounded copilot profile fixture
pipeline: product-validation
feature_id: F-job-copilot
status: must_test
exit_criteria:
  - Scenario for F-job-copilot reviewed and approved in scenarios.md
  - Fixtures for F-job-copilot ready (or N/A documented)
  - go_test / checks for F-job-copilot pass; run-log records result
  - audit-report covers evidence expectations for this feature (or N/A)
  - test-reviewer pass; summarizer closes round with trail in .agent/work/F-job-copilot/
out_of_scope:
  - Other features (test only F-job-copilot this round)
  - Live FreeSWITCH unless this feature is F-edge-fs-live and human unlocked
  - Committing secrets
  - Product feature coding (use coral-phase)
packages:
  - ./internal/profile
  - ./internal/gateway/ingest
docs:
  - tests/agent/FEATURES.md
  - tests/agent/features/catalog.yaml
  - tests/agent/scenarios/F-job-copilot.yaml
  - tests/agent/MANIFEST.yaml
  - docs/VALIDATION_PIPELINE.md
