id: cc-3-voice-binding
name: Persona voice required + Speak wiring (CC Phase 3)
pipeline: contact-agent-cc
exit_criteria:
  - Profile schema requires persona.voice (or voice_id) for Talk/Speak profiles; publish 422 if missing
  - Voice mapping keyed by system-bound speak gateway id (e.g. sarvam-tts → speaker name)
  - Composer Speak path always passes SpeakRequest.VoiceID + Language from profile + session.active_language
  - Sarvam TTS already maps VoiceID → speaker; fake Speak accepts VoiceID without fail
  - Audit or analytics records resolved voice_id + speak gateway on turn (or document deferred hook)
  - go test ./internal/profile/ ./internal/runtime/composer/ ./internal/gateway/sarvamtts/ pass
out_of_scope:
  - GET /v1/gateways/{id}/voices catalog API (document as coral-file follow-up)
  - Vendor override at profile level
  - Clip ladder (cc-4)
  - coral-file voice picker UI
  - Committing secrets
docs:
  - docs/product/CONTACT_AGENT.md
  - docs/architecture/PROFILE_SCHEMA.md
  - docs/architecture/PORTS.md
  - docs/architecture/CONTROL_API.md
packages:
  - ./internal/profile
  - ./internal/runtime/composer
  - ./internal/control
  - ./internal/gateway/sarvamtts
  - ./internal/gateway/fake
