id: validation-v1
name: Product validation wave — Control + memory + audit (no FS)
pipeline: validation-v1
platform_first: post A–F validation
exit_criteria:
  - .agent/work/validation-v1/scenarios.md lists Tier A (V1-A01..A08) + audit assertion table
  - go test ./internal/validation -count=1 green (Tier A); Tier B skip without key
  - audit-report.md has zero blocking gaps vs assertion table
  - summary.md records V1 pass/fail; residual risks named
  - FreeSWITCH / Postgres durable audit deferred (Tier C)
out_of_scope:
  - FreeSWITCH / call-server E2E
  - Product feature coding outside validation assets (use coral-phase)
  - Committing API keys or .agent/secrets.local.json
docs:
  - docs/VALIDATION_PIPELINE.md
  - docs/architecture/CONTROL_API.md
  - docs/architecture/ANALYTICS_AND_POSTCALL.md
  - docs/architecture/OPERATIONS.md
  - tests/agent/MANIFEST.yaml
  - tests/agent/FEATURES.md
depends_on: coral-phase A–F complete (or equivalent surface)
