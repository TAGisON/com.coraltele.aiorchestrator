id: cc-6-lab-validation
name: Lab + CC scenarios prove vertical (CC Phase 6)
pipeline: contact-agent-cc
exit_criteria:
  - Lab UI separates tenant engines config from profile behaviour presets (Sales / R&D / after-hours)
  - Realtime agent demo uses system-bound gateways (not comma failover as CC default)
  - docs/LAB.md updated for Contact-agent CC path (engines, language lock, voice, ladder, transcript)
  - At least two profile presets same-tenant with different rules/persona/voice; shared system engines
  - Scenario checklist or tests/agent scenarios cover — multi-turn context; language lock; quota error UX; clip/ladder if available
  - go test ./... (or documented package set) green; lab smoke paths documented
out_of_scope:
  - coral-file / home-page
  - Live FreeSWITCH E2E (lab + APIs only unless already working)
  - New vendors beyond existing registry
  - Committing secrets / .env
docs:
  - docs/LAB.md
  - docs/product/CONTACT_AGENT.md
  - docs/product/SYSTEM_ENGINES.md
  - docs/product/LANGUAGE_POLICY.md
  - docs/VALIDATION_PIPELINE.md
packages:
  - ./web/lab
  - ./internal/control
  - ./cmd/aiorchestrator
