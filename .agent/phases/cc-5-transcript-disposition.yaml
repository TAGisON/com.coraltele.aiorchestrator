id: cc-5-transcript-disposition
name: Transcript + disposition APIs (CC Phase 5)
pipeline: contact-agent-cc
exit_criteria:
  - Durable transcript model (transcript_turn table or equivalent structured store keyed by session_id)
  - GET /v1/sessions/{id}/transcript returns ordered turns
  - Disposition stored for session (AI suggestion from templates.disposition / postcall path)
  - GET /v1/sessions/{id}/disposition (and/or postcall writes disposition) documented in CONTROL_API.md
  - Skill contracts for resolve_customer / warm_transfer / create_ticket remain stable; disposition push skill hook documented or stubbed
  - Audit includes turn correlation suitable for CC evidence
  - go test ./internal/control/ ./internal/store/ pass
out_of_scope:
  - home-page transcript UI
  - Full CRM writeback to production Coral (stub/gateway contract only)
  - Customer cross-call memory (memory.scope=customer) unless already trivial
  - Committing secrets
docs:
  - docs/product/CONTACT_AGENT.md
  - docs/architecture/CONTROL_API.md
  - docs/architecture/ANALYTICS_AND_POSTCALL.md
  - docs/architecture/INTEGRATION.md
  - docs/architecture/RULES_AND_SKILLS.md
packages:
  - ./internal/store
  - ./internal/control
  - ./internal/runtime/observe
  - ./internal/gateway/coralcrm
  - ./internal/gateway/coraltransfer
