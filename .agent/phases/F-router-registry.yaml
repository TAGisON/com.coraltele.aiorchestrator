id: F-router-registry
name: Validate feature — Registry and profile validation
pipeline: product-validation
feature_id: F-router-registry
status: must_test
exit_criteria:
  - Scenario for F-router-registry reviewed and approved in scenarios.md
  - Fixtures for F-router-registry ready (or N/A documented)
  - go_test / checks for F-router-registry pass; run-log records result
  - audit-report covers evidence expectations for this feature (or N/A)
  - test-reviewer pass; summarizer closes round with trail in .agent/work/F-router-registry/
out_of_scope:
  - Other features (test only F-router-registry this round)
