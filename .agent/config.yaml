repo: com.coraltele.aiorchestrator
# Default pipeline for `agent.ps1 start` when -Pipeline omitted
pipeline: coral-phase
version: 1

mail:
  enabled: true
  secrets_file: .agent/secrets.local.json

monitor:
  interval_sec: 60
  # false = write NEXT_PROMPT + DISPATCH only (no Cursor/console popups).
  # true  = also open a new Cursor window (irritating; opt-in only).
  assign_opens_new_cursor_window: false
  # Monitor itself starts Hidden (no Minimized PowerShell on the desktop).
  window_style: Hidden

limits:
  max_coder_review_loops: 2

# Role/skill/artifact maps live in .agent/pipelines/<name>.json
# - coral-phase: planner → coder → reviewer → summarizer
# - product-validation: scenario-planner → … → test-summarizer (per-feature pause)
# - validation-v1: same roles; single wave phase validation-v1 (Control+memory Tier A)

docs:
  platform_first: docs/architecture/PLATFORM_FIRST.md
  ports: docs/architecture/PORTS.md
  control_api: docs/architecture/CONTROL_API.md
  solution: docs/SOLUTION.md
  validation: docs/VALIDATION_PIPELINE.md
