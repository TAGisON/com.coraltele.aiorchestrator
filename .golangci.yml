# golangci-lint — CI.3 (docs/11 OD-11-5)
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    check-type-assertions: false
  govet:
    enable-all: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: true

output:
  formats:
    - format: colored-line-number
